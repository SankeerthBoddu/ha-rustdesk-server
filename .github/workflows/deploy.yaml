---
name: Deploy

# yamllint disable-line rule:truthy
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Published release tag to build, for example v1.1.16-2"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.normalize.outputs.version }}
      name: ${{ steps.normalize.outputs.name }}
      description: ${{ steps.normalize.outputs.description }}
      url: ${{ steps.normalize.outputs.url }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_ref || github.ref }}
          persist-credentials: false

      - name: Get App information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./rustdesk-server"

      - name: Normalize App information
        id: normalize
        shell: bash
        run: |
          version=${{ steps.info.outputs.version }}
          name=${{ steps.info.outputs.name }}
          description=${{ steps.info.outputs.description }}
          url=${{ steps.info.outputs.url }}
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "description=${description}" >> "$GITHUB_OUTPUT"
          if [[ -n "${url}" && "${url}" != "null" ]]; then
            echo "url=${url}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release tag matches App version
        if: github.event_name == 'release' || inputs.release_ref != ''
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_ref }}
          APP_VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != "v${APP_VERSION}" ]]; then
            echo "::error::Release tag ${RELEASE_TAG} must be v${APP_VERSION}"
            exit 1
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.06.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ha-rustdesk-server
          registry-prefix: ghcr.io/sankeerthboddu

  build:
    name: Build & publish ${{ matrix.arch }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout release
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_ref || github.ref }}
          persist-credentials: false

      - name: Build, push, and sign image
        uses: home-assistant/builder/actions/build-image@2026.06.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: ./rustdesk-server
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            io.hass.url=${{ needs.prepare.outputs.url }}
          push: true
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-arch manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Publish multi-arch manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.06.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ha-rustdesk-server
          image-tags: |
            ${{ needs.prepare.outputs.version }}
            latest
          registry-prefix: ghcr.io/sankeerthboddu

      - name: Make multi-arch package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            /user/packages/container/ha-rustdesk-server \
            -f visibility=public || true
