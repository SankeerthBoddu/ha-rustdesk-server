---
name: Publish v1.1.16-1 (one-shot)

# Temporary one-shot workflow used to publish the release from the exact
# release commit. It is removed after the release and package build finish.
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release-1.1.16-1-once.yaml"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Create v1.1.16-1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.1.16-1" \
            --repo "${{ github.repository }}" \
            --target "e92b042a1eec32ef34fb8d573e33b0b3b80c247e" \
            --title "v1.1.16-1" \
            --notes $'Home Assistant add-on release for RustDesk Server 1.1.16.\n\nHighlights:\n- RustDesk Server 1.1.15 -> 1.1.16.\n- Fixes long-offline peers being reported online due to i32 overflow.\n- Updates mio to address a critical dependency issue.\n- Fixes unauthenticated UDP punch-hole reflection/amplification abuse.\n- Updates markdownlint-cli2-action to v24, actions/stale to v11, and hadolint-action to v3.4.0.'

  build:
    name: Build & publish ${{ matrix.arch }}
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - aarch64
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: e92b042a1eec32ef34fb8d573e33b0b3b80c247e

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: home-assistant/builder@2024.08.2
        with:
          args: |
            --${{ matrix.arch }} \
            --target /data/rustdesk-server \
            --docker-hub-check \
            --addon

      - name: Make package public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PATCH \
            /user/packages/container/${{ matrix.arch }}-ha-rustdesk-server \
            -f visibility=public || true
